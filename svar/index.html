<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#a4523a">
<title>Svara på kommentar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Lora:wght@600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f6f0e8; --kort: #fffdf9; --text: #1d1a15; --dov: #6f665b; --linje: #e2d8cb; --accent: #a4523a; --accent-text: #fff; --ok: #3d6b45; --fel: #a3322a; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1d1a15; --kort: #27231d; --text: #f6f0e8; --dov: #b3a898; --linje: #3a342b; --accent: #d57c5f; --accent-text: #1d1a15; --ok: #8fc39a; --fel: #ef8a80; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 Inter, -apple-system, system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom)); }
  h1 { font: 600 22px/1.2 Lora, Georgia, serif; margin: 8px 0 14px; }
  .kort { background: var(--kort); border: 1px solid var(--linje); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .liten { color: var(--dov); font-size: 13px; margin: 0 0 6px; }
  .citat { font-size: 17px; margin: 0; white-space: pre-wrap; }
  .etikett { font-weight: 600; font-size: 14px; margin: 0 0 6px; }
  textarea { width: 100%; min-height: 140px; resize: vertical; border: 1px solid var(--linje); border-radius: 10px; padding: 12px; font: inherit; color: var(--text); background: var(--bg); }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .knapp { width: 100%; margin-top: 12px; border: 0; border-radius: 12px; padding: 15px; font: 600 17px Inter, sans-serif; background: var(--accent); color: var(--accent-text); cursor: pointer; }
  .knapp.andra { background: transparent; color: var(--dov); border: 1px solid var(--linje); font-weight: 400; font-size: 15px; padding: 12px; }
  .knapp:disabled { opacity: .5; }
  .meddelande { padding: 14px; border-radius: 12px; margin: 12px 0; font-weight: 600; }
  .meddelande.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
  .meddelande.fel { background: color-mix(in srgb, var(--fel) 15%, transparent); color: var(--fel); }
  a { color: var(--accent); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Svara på kommentar</h1>
  <div id="laddar" class="liten">Hämtar kommentaren …</div>
  <div id="innehall" hidden>
    <div class="kort">
      <p class="liten" id="var"></p>
      <p class="citat" id="kommentar"></p>
    </div>
    <div class="kort">
      <p class="etikett">Hemplats svar</p>
      <p class="liten">Ändra direkt i rutan om du vill. Svaret publiceras från Hemplats sida inom en timme.</p>
      <textarea id="svar" maxlength="2000"></textarea>
      <button class="knapp" id="skicka">Skicka svaret</button>
      <button class="knapp andra" id="neka">Svara inte på den här</button>
    </div>
    <p class="liten" id="lankrad" hidden><a id="lank" target="_blank" rel="noopener">Öppna kommentaren</a></p>
  </div>
  <div id="besked" class="meddelande" hidden></div>
</main>
<script>
const ADRESS = "https://usfadqstzdrvnuccuipw.supabase.co/functions/v1/svar";
const q = new URLSearchParams(location.search);
const id = q.get("id"), s = q.get("s");
const $ = (x) => document.getElementById(x);
const PLATTFORM = { facebook: "Facebook", instagram: "Instagram", youtube: "YouTube" };
const STATUS = { godkand: "Godkänt, skickas inom en timme.", skickad: "Svaret är redan skickat.",
                 nekad: "Du valde att inte svara.", fel: "Förra försöket att skicka misslyckades." };

async function anrop(kropp) {
  const r = await fetch(ADRESS, { method: "POST", headers: { "content-type": "application/json" },
                                  body: JSON.stringify({ id, s, ...kropp }) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.fel || "Det gick inte just nu.");
  return d;
}
function besked(text, ok) {
  const b = $("besked"); b.textContent = text; b.className = "meddelande " + (ok ? "ok" : "fel"); b.hidden = false;
}

(async () => {
  if (!id || !s) { $("laddar").hidden = true; besked("Länken är ofullständig. Öppna den från mejlet igen.", false); return; }
  try {
    const d = await anrop({ handling: "hamta" });
    $("var").textContent = [PLATTFORM[d.plattform] || d.plattform, d.rubrik && `”${d.rubrik}”`].filter(Boolean).join(" · ");
    $("kommentar").textContent = d.text || "";
    $("svar").value = d.svar_text || d.svar_forslag || "";
    if (d.lank) { $("lank").href = d.lank; $("lankrad").hidden = false; }
    $("laddar").hidden = true; $("innehall").hidden = false;
    if (d.svar_status && STATUS[d.svar_status]) besked(STATUS[d.svar_status] + (d.svar_fel ? ` (${d.svar_fel})` : ""), d.svar_status !== "fel");
    if (d.svar_status === "skickad") { $("skicka").hidden = true; $("neka").hidden = true; $("svar").readOnly = true; }
  } catch (e) { $("laddar").hidden = true; besked(e.message, false); }
})();

async function gor(handling) {
  $("skicka").disabled = $("neka").disabled = true;
  try {
    await anrop({ handling, text: $("svar").value });
    besked(handling === "skicka" ? "Klart! Svaret skickas inom en timme." : "Okej, vi svarar inte på den.", true);
  } catch (e) { besked(e.message, false); }
  $("skicka").disabled = $("neka").disabled = false;
}
$("skicka").onclick = () => gor("skicka");
$("neka").onclick = () => gor("neka");
</script>
</body>
</html>
